[package]
name = "pn_config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PN-Patch.exe: install/uninstall the Private Nurse — Modern Windows Patch, edit its settings, play"
publish = false

[[bin]]
name = "PN-Patch"
path = "src/main.rs"

[dependencies]
pn_shared = { path = "../pn_shared" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
