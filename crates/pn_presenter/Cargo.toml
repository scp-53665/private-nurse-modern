[package]
name = "pn_presenter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private Nurse — Modern Windows Patch: fakecdda.dll proxy + GDI hooks"
publish = false

[lib]
# `rlib` alongside `cdylib` so the geometry/config math can be unit-tested
# (`cargo test --target i686-pc-windows-msvc`); the shipped artifact is the DLL.
crate-type = ["cdylib", "rlib"]
# The package keeps the internal name `pn_presenter`; the artifact that ships is
# `pn_modern.dll`. PN-Patch looks for exactly this filename next to itself.
name = "pn_modern"

[dependencies]
pn_shared = { path = "../pn_shared" }
# Raw Win32 bindings, pinned to the version cached on this machine. Feature list is
# deliberately minimal: only subsystems this DLL calls.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# missing_safety_doc NOT set: warn-by-default since edition 2024

[lints.clippy]
all = "warn"
pedantic = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
